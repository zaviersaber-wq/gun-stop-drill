<html lang="en">

  <style>
    :root {
      --bg-canvas: #f8fafc;
      --surface-card: #ffffff;
      --accent-red: #dc2626;
      --accent-dark: #111827;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: #0f172a;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .drill-header-bar {
      background: #ffffff;
      border-top: 1px solid #94a3b8;
      border-bottom: 1px solid #94a3b8;
    }

    .drill-title-underline {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }

    .step-card {
      transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 160ms ease,
                  background-color 160ms ease,
                  border-color 160ms ease;
      user-select: none;
      touch-action: manipulation;
    }

    .step-card:active:not(:disabled) {
      transform: scale(0.97);
    }

    .step-card-safe {
      background-color: #fdf3f3;
      border: 1px solid #f5e2e2;
    }

    .step-card-safe:hover:not(:disabled) {
      background-color: #fbe8e8;
      border-color: #fecaca;
      box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.12), 0 4px 10px -6px rgba(220, 38, 38, 0.08);
      transform: translateY(-2px);
    }

    .step-card-neutral {
      background-color: #f8f9fa;
      border: 1px solid #eef0f2;
    }

    .step-card-neutral:hover:not(:disabled) {
      background-color: #f1f3f5;
      border-color: #cbd5e1;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -6px rgba(15, 23, 42, 0.05);
      transform: translateY(-2px);
    }
